name: ci-amapy
run-name: GROUP - ${{ github.workflow }}-${{ github.ref }}-${{ github.actor }}

on:
  push:
    branches:
      - '**'
    tags:
      - 'utils-v*.*.*'
      - 'pluggy-v*.*.*'
      - 'db-v*.*.*'
      - 'contents-v*.*.*'
      - 'core-v*.*.*'
      - 'plugin-gcr-v*.*.*'
      - 'plugin-gcs-v*.*.*'
      - 'plugin-posix-v*.*.*'
      - 'plugin-s3-v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  # Detect which packages changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      utils: ${{ steps.filter.outputs.utils }}
      pluggy: ${{ steps.filter.outputs.pluggy }}
      db: ${{ steps.filter.outputs.db }}
      contents: ${{ steps.filter.outputs.contents }}
      core: ${{ steps.filter.outputs.core }}
      plugin-gcr: ${{ steps.filter.outputs.plugin-gcr }}
      plugin-gcs: ${{ steps.filter.outputs.plugin-gcs }}
      plugin-posix: ${{ steps.filter.outputs.plugin-posix }}
      plugin-s3: ${{ steps.filter.outputs.plugin-s3 }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            utils:
              - 'client/asset-utils/**'
            pluggy:
              - 'client/asset-pluggy/**'
            db:
              - 'client/asset-db/**'
            contents:
              - 'client/asset-contents/**'
            core:
              - 'client/asset-core/**'
            plugin-gcr:
              - 'client/asset-plugin-gcr/**'
            plugin-gcs:
              - 'client/asset-plugin-gcs/**'
            plugin-posix:
              - 'client/asset-plugin-posix/**'
            plugin-s3:
              - 'client/asset-plugin-s3/**'

  ci-asset-utils:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.utils == 'true' ||
      startsWith(github.ref, 'refs/tags/utils-v')
    runs-on: [ubuntu-latest]
    timeout-minutes: 10
    env:
      PYTHON_VERSION: "3.10"
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup CI environment
        working-directory: client
        run: |
          #!/usr/bin/env bash
          set -x
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install dependencies
        working-directory: client/asset-utils
        run: python -m pip install -e .

      - name: Run flake8
        continue-on-error: true
        working-directory: client/asset-utils
        run: flake8 .

      - name: Run tests
        continue-on-error: true
        working-directory: client/asset-utils
        run: pytest --cov=./ --cov-report=xml

      - name: Build package
        working-directory: client/asset-utils
        run: python -m build

      - name: Check package
        working-directory: client/asset-utils
        run: twine check dist/*

      - name: Store built package
        if: startsWith(github.ref, 'refs/tags/utils')
        uses: actions/upload-artifact@v4
        with:
          name: asset-utils-dist
          path: client/asset-utils/dist/

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/utils')
        working-directory: client/asset-utils
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

