name: ci-amapy
run-name: GROUP - ${{ github.workflow }}-${{ github.ref }}-${{ github.actor }}

on:
  push:
    branches:
      - '**'
    tags:
      - 'utils-v*.*.*'
      - 'pluggy-v*.*.*'
      - 'db-v*.*.*'
      - 'contents-v*.*.*'
      - 'core-v*.*.*'
      - 'plugin-gcr-v*.*.*'
      - 'plugin-gcs-v*.*.*'
      - 'plugin-posix-v*.*.*'
      - 'plugin-s3-v*.*.*'
    paths:
      - 'client/asset-utils/**'
      - 'client/asset-pluggy/**'
      - 'client/asset-db/**'
      - 'client/asset-contents/**'
      - 'client/asset-core/**'
      - 'client/asset-plugin-gcr/**'
      - 'client/asset-plugin-gcs/**'
      - 'client/asset-plugin-posix/**'
      - 'client/asset-plugin-s3/**'
      - '.github/workflows/ci-amapy.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  ci-asset-utils:
    runs-on: [ubuntu-latest]
    timeout-minutes: 10
    env:
      PYTHON_VERSION: "3.10"
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup CI environment
        working-directory: client/asset-utils
        run: |
          #!/usr/bin/env bash
          set -x
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install dependencies
        working-directory: client/asset-utils
        run: python -m pip install -e .

      - name: Run flake8
        continue-on-error: true
        working-directory: client/asset-utils
        run: flake8 .

      - name: Run tests
        continue-on-error: true
        working-directory: client/asset-utils
        run: pytest --cov=./ --cov-report=xml

      - name: Build package
        working-directory: client/asset-utils
        run: python -m build

      - name: Check package
        working-directory: client/asset-utils
        run: twine check dist/*

      - name: Store built package
        if: startsWith(github.ref, 'refs/tags/utils')
        uses: actions/upload-artifact@v4
        with:
          name: asset-utils-dist
          path: client/asset-utils/dist/

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/utils')
        working-directory: client/asset-utils
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

  ci-asset-pluggy:
    needs: ci-asset-utils  # This job waits for ci-asset-utils to complete
    runs-on: [ubuntu-latest]
    timeout-minutes: 10
    env:
      PYTHON_VERSION: "3.10"
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup CI environment
        working-directory: client
        run: |
          #!/usr/bin/env bash
          set -x
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install dependencies
        working-directory: client/asset-pluggy
        run: python -m pip install -e .

      - name: Run flake8
