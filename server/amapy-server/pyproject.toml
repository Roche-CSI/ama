[build-system]
requires = ["setuptools>=74.0.0,<75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amapy-server"
version = "1.1.0"
description = "The server-side component of the ama project."
readme = "README.md"
authors = [
    { name = "Swarup Mahanti", email = "swarup.mahanti@roche.com" }
]
maintainers = [
    { name = "Swarup Mahanti", email = "swarup.mahanti@roche.com" }
]
license = { text = "Copyright (c) 2024 Roche Diagnostics Computation Science & Informatics" }
requires-python = ">=3.12,<3.13"

dependencies = [
    "amapy-pluggy==1.1.*",
    "amapy-plugin-gcs==1.1.*",
    "amapy-plugin-s3==1.1.*",
    "amapy-utils==1.1.*",
    "Flask-Admin==1.6.0",
    "Flask-Cors==3.0.10",
    "Flask-Dance==7.0.0",
    "Flask-Login==0.6.3",
    "Flask==2.1.1",
    "Jinja2==3.0.*",
    "Werkzeug==2.0.1",
    "aioshutil==1.3",
    "elasticsearch==8.15.1",
    "google-auth-oauthlib==0.5.*",
    "gunicorn==20.1.*",
    "packaging==23.1.*",
    "peewee==3.14.*",
    "psycopg2==2.9.2",
    "sentence-transformers==3.2.1",
    "wtf-peewee==3.0.3",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages]
find = { }

[tool.setuptools.package-data]
"amapy_server" = [
    "configs/yamls/*.yaml",
    "templates/**",
    "static/**"
]

[project.scripts]
ama-server = "amapy_server.main:main"
