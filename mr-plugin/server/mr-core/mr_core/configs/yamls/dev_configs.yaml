REMOTE:
    GCP_PROJECT_ID:
        google-dev-project
    GCP_BUCKET_ID:
        # separate buckets for repo and staging area
        # this allows have different access permissions for users
        # assets bucket will be readonly for users
        # whereas staging bucket will be read and write
        # repo: mybucket/dev/admin-user
        repo: mybucket/dev/admin-user_sb
        staging: mybucket_staging/dev/admin-user
    GCP_CONTENTS_DIR:
        repo: contents
        staging: contents
    GCP_ASSETS_DIR:
        repo: assets
    GCP_ASSET_CLASSES_DIR:
        repo: asset_classes
    GCP_ASSET_ALIASES_DIR:
        repo: asset_aliases

DATABASE:
    database: model_registry
    user: postgres
    password: postgres
    host: localhost
    port: 5432

SERVER:
    BASE_URL: http://localhost:5000

FRONTEND:
    BASE_URL: http://localhost:5173
