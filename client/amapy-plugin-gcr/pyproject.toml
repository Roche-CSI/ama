[build-system]
requires = ["setuptools>=74.0.0,<75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amapy-plugin-gcr"
version = "1.0.1"
description = "The GCR plugin for the ama project."
readme = "README.md"
authors = [
    { name = "Swarup Mahanti", email = "swarup.mahanti@roche.com" }
]
maintainers = [
    { name = "Swarup Mahanti", email = "swarup.mahanti@roche.com" }
]
license = { text = "Copyright (c) 2024 Roche Diagnostics Computation Science & Informatics" }
requires-python = ">=3.12,<3.13"  # "==3.12.*"
dependencies = [
    "amapy-contents==1.*",
    "amapy-pluggy==1.*",
    "amapy-utils==1.*",
    "backoff>=2.2,<3.0",
    "google-auth>=2.35,<3.0",
    "pyopenssl>=24.2,<27.0",
    "speedtest-cli>=2.1,<3.0"
]

[tool.setuptools.packages.find]
include = ["*"]
namespaces = false
