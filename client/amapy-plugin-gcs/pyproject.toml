[build-system]
requires = ["setuptools>=74.0.0,<75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amapy-plugin-gcs"
version = "1.1.0"
description = "The GCS plugin for the ama project."
readme = "README.md"
authors = [
    { name = "Swarup Mahanti", email = "swarup.mahanti@roche.com" }
]
maintainers = [
    { name = "Swarup Mahanti", email = "swarup.mahanti@roche.com" }
]
license = { text = "Copyright (c) 2024 Roche Diagnostics Computation Science & Informatics" }
requires-python = ">=3.12,<3.13"  # "==3.12.*"
dependencies = [
    "amapy-contents==1.1.*",
    "amapy-pluggy==1.1.*",
    "amapy-utils==1.1.*",
    "backoff==2.2.*",
    "gcloud-aio-storage==9.4.*",
    "google-cloud-storage==3.1.*"
]

[project.optional-dependencies]
test = [
    "cloud-storage-mocker==0.3.*",
]

[tool.setuptools.packages.find]
include = ["*"]
namespaces = false
