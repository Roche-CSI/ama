[build-system]
requires = ["setuptools>=80.9.0,<81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amapy-pluggy"
version = "1.2.0"
description = "A Plugin handler for ama project."
readme = "README.md"
authors = [
    { name = "Swarup Mahanti", email = "swarup.mahanti@roche.com" }
]
maintainers = [
    { name = "Swarup Mahanti", email = "swarup.mahanti@roche.com" }
]
license = { text = "Copyright (c) 2024 Roche Diagnostics Computation Science & Informatics" }
requires-python = ">=3.14,<3.15"
classifiers = [
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "amapy-utils==1.2.*",
    "pluggy==1.6.*",
]

[tool.setuptools.packages.find]
include = ["*"]
namespaces = false
