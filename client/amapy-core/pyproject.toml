[build-system]
requires = ["setuptools>=74.0.0,<75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amapy-core"
version = "1.0.2"
description = "The Core package for the ama project."
readme = "README.md"
authors = [
    { name = "Swarup Mahanti", email = "swarup.mahanti@roche.com" }
]
maintainers = [
    { name = "Swarup Mahanti", email = "swarup.mahanti@roche.com" }
]
license = { text = "Copyright (c) 2024 Roche Diagnostics Computation Science & Informatics" }
requires-python = ">=3.12,<3.13"  # "==3.12.*"
dependencies = [
    "amapy-contents==1.*",
    "amapy-db==1.*",
    "amapy-pluggy==1.*",
    "amapy-utils==1.*",
    "google-auth-oauthlib==1.3.*",
    "jinja2==3.1.*",
    "packaging==26.0.*",
    "pathspec==1.0.*"
]

[tool.setuptools.packages.find]
include = ["*"]
namespaces = false

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"amapy_core.configs.yamls" = ["*.yaml"]
"amapy_core.api.templates" = ["*.html"]
