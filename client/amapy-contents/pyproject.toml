[build-system]
requires = ["setuptools>=74.0.0,<75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amapy-contents"
version = "1.1.0"
description = "The Contents plugin for ama project."
readme = "README.md"
license = { text = "Copyright (c) 2024 Roche Diagnostics Computation Science & Informatics" }
requires-python = ">=3.12,<3.13"  # "==3.12.*"
dependencies = [
    "aiohttp==3.12.*",
    "amapy-db==1.1.*",
    "amapy-pluggy==1.1.*",
    "amapy-utils==1.1.*",
    "backoff==2.2.*"
]

[tool.setuptools.packages.find]
include = ["*"]
namespaces = false
