[build-system]
requires = ["setuptools>=74.0.0,<75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amapy-utils"
version = "1.0.1"
description = "A utility package that provides common functionality shared across the ama ecosystem."
readme = "README.md"
authors = [
    { name = "Swarup Mahanti", email = "swarup.mahanti@roche.com" }
]
maintainers = [
    { name = "Swarup Mahanti", email = "swarup.mahanti@roche.com" }
]
license = { text = "Copyright (c) 2024 Roche Diagnostics Computation Science & Informatics" }
requires-python = ">=3.12,<3.13"  # "==3.12.*"
dependencies = [
    "aiofiles>=24.1,<26.0",
    "colorama>=0.4.6,<0.5.0",
    "crcmod>=1.7,<2.0",
    "psutil>=6.0,<8.0",
    "pyopenssl>=24.2,<27.0",
    "pypager>=3.0.1,<4.0",
    "pytz>=2024.1",
    "pyyaml>=6.0.1,<7.0",
    "requests>=2.32,<3.0",
    "ruamel.yaml>=0.18,<0.20",
    "speedtest-cli>=2.1,<3.0",
    "tabulate>=0.9,<0.11",
    "tqdm>=4.66,<5.0"
]

[tool.setuptools.packages.find]
include = ["*"]
namespaces = false
