[build-system]
requires = ["setuptools>=80.9.0,<81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amapy-utils"
version = "1.2.0"
description = "A utility package that provides common functionality shared across the ama ecosystem."
readme = "README.md"
authors = [
    { name = "Swarup Mahanti", email = "swarup.mahanti@roche.com" }
]
maintainers = [
    { name = "Swarup Mahanti", email = "swarup.mahanti@roche.com" }
]
license = { text = "Copyright (c) 2024 Roche Diagnostics Computation Science & Informatics" }
requires-python = ">=3.14,<3.15"
classifiers = [
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiofiles==25.1.*",
    "colorama==0.4.*",
    "google-crc32c==1.8.*",
    "psutil==7.1.*",
    "pyyaml==6.0.*",
    "requests==2.33.*",
    "ruamel.yaml==0.18.*",
    "tabulate==0.10.*",
    "tqdm==4.67.*",
    "tzdata==2025.*" # only needed for Windows
]

[tool.setuptools.packages.find]
include = ["*"]
namespaces = false
